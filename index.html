<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b2545"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Safety"><meta name="format-detection" content="telephone=no"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Richmond Elevator Safety</title>
<style>
:root{--bg:#15181c;--cell:#1d2126;--cell2:#262b33;--sep:#353c46;--tx:#eef0f2;--dim:#9aa3af;--amber:#f2a71b;--red:#ff5d4d;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
#app{height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;background:var(--bg)}
a{cursor:pointer;user-select:none;-webkit-user-select:none}
.nav{flex:none;display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;padding:calc(var(--top) + 4px) 8px 4px;min-height:calc(var(--top) + 48px);background:rgba(21,24,28,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);z-index:5}
.nav b{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.nav a{color:var(--amber);padding:10px 8px}.nav a:last-child{text-align:right}
.prog{flex:none;height:3px;background:var(--cell2)}.prog i{display:block;height:100%;background:var(--amber);transition:width .3s}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.bar{flex:none;display:flex;gap:10px;padding:10px 16px calc(var(--bot) + 10px);background:rgba(21,24,28,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep)}
button{font:inherit;font-weight:600;height:50px;padding:0 16px;border:0;border-radius:14px;background:var(--amber);color:#15181c;flex:1;transition:transform .1s,opacity .1s}
button:active{transform:scale(.97);opacity:.85}button.g{background:var(--cell2);color:var(--tx)}button.r{background:var(--red);color:#fff}
.row{display:flex;gap:8px;align-items:flex-start}.row button{flex:none;width:50px;padding:0;font-size:22px;background:var(--cell2)}.row button.w{width:auto;padding:0 18px;font-size:17px;background:var(--amber)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}.brand img{height:38px;background:#eceded;border-radius:9px;padding:5px 9px}.brand small{color:var(--dim);font-size:12px;letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
.lt{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:10px 0 22px}
.grp{background:var(--cell);border-radius:12px;overflow:hidden;margin-bottom:22px}
.li{display:flex;align-items:center;gap:14px;padding:12px 14px;position:relative;user-select:none}.li+.li::before{content:"";position:absolute;left:62px;right:0;top:0;border-top:.5px solid var(--sep)}.li:active{background:var(--cell2)}
.li::after{content:"›";color:var(--dim);font-size:26px;line-height:1}.li span{flex:1;min-width:0}.li b{display:block;font-weight:600}.li small{color:var(--dim);font-size:13px}
.ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:19px;flex:none}
label{display:block;margin:20px 4px 7px;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.03em}label:first-child{margin-top:4px}.m{color:var(--dim);font-size:13px;margin:8px 4px}
input,textarea{display:block;width:100%;font:inherit;padding:13px 14px;border:0;border-radius:12px;background:var(--cell);color:var(--tx);outline:0;-webkit-appearance:none;appearance:none;min-height:50px}input:focus,textarea:focus{box-shadow:inset 0 0 0 1.5px var(--amber)}input::placeholder,textarea::placeholder{color:#5f6874}
canvas{display:block;width:100%;background:#fff;border-radius:12px;touch-action:none}
.n{background:var(--cell);padding:12px 14px;border-radius:12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}.n a{color:var(--red);padding:0 4px}
.h{background:var(--cell);border-radius:12px;padding:14px;margin-bottom:12px;line-height:1.5}.h .row button{flex:1;width:auto;height:42px;font-size:15px;padding:0 6px;background:var(--cell2);color:var(--tx)}.h .row button.w{background:var(--amber);color:#15181c}.h .row button.d{color:var(--red)}
.empty{text-align:center;color:var(--dim);margin-top:80px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20;animation:f .2s}@keyframes f{from{opacity:0}}
.sh{width:100%;max-width:520px;margin:auto;padding:12px 12px calc(var(--bot) + 12px)}.sh .box{background:var(--cell);border-radius:14px;padding:16px;text-align:center;margin-bottom:8px}.sh button{width:100%;margin-bottom:8px}
.toast{position:fixed;top:calc(var(--top) + 58px);left:50%;transform:translateX(-50%);background:var(--cell2);padding:10px 18px;border-radius:22px;z-index:30;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:f .2s;white-space:nowrap}
.bad{box-shadow:inset 0 0 0 1.5px var(--red)!important}

/* RICHMOND ATELIER: single authoritative mobile design system */
:root{color-scheme:dark;--bg:#020d1b;--cell:#0c1d31;--cell2:#13283f;--sep:#2b5276;--tx:#f4f7ff;--dim:#b0c0d4;--amber:#f2bc6b;--red:#ef7967;--blue:#27baff;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
html,body,#app{background:#020d1b;color:var(--tx)}
#app{max-width:520px;isolation:isolate;box-shadow:0 0 100px #000}
main{padding:22px 22px 30px;animation:page-arrive .48s cubic-bezier(.2,.75,.2,1) both;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
@keyframes page-arrive{from{opacity:0;transform:translate3d(16px,9px,0);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.nav{padding:calc(var(--top) + 7px) 15px 8px;min-height:calc(var(--top) + 58px);background:linear-gradient(145deg,#06192c,#0c2a48);border-bottom:1px solid #2c4b65}
.nav b{font-size:14px;color:#f5f7fc;max-width:45vw}.nav a{color:#f0c582;font-size:15px}
.prog{height:3px;background:#18334e}.prog i{background:linear-gradient(90deg,#1dbbff,#e7b46b);transition:width .5s cubic-bezier(.2,.75,.2,1)}
.bar{padding:12px 18px calc(12px + var(--bot));background:linear-gradient(180deg,#071b2bed,#061322fa);border-top:1px solid #254867;backdrop-filter:blur(22px)}
button{min-width:0;min-height:48px;height:auto;padding:13px 15px;border-radius:15px;background:linear-gradient(115deg,#087fbd,#13b6e9 58%,#5bceee);color:#fff;font-weight:700;box-shadow:0 6px 22px #008bd533;transition:transform .22s ease,filter .22s ease,box-shadow .22s ease}
button:active{transform:scale(.965);filter:brightness(1.15)}button.g{background:#162d43;color:#e6f0ff;box-shadow:inset 0 0 0 1px #355779}
.row{min-width:0}.row button{width:48px;flex:0 0 48px;background:#173450;color:#f0c582;box-shadow:inset 0 0 0 1px #345778}
label{color:#e5b878;letter-spacing:.15em;font-size:11px;font-weight:700;margin:23px 2px 9px}
input,textarea,select{max-width:100%;min-width:0;min-height:54px;border:1px solid #355979;border-radius:14px;background:linear-gradient(150deg,#102b44,#0b2035);color:#f5f8ff;box-shadow:inset 0 1px 0 #ffffff0c;outline:none}
input:focus,textarea:focus,select:focus{border-color:#edb96d;box-shadow:0 0 0 2px #f5b85e27,0 0 18px #c38d2b19}
input::placeholder,textarea::placeholder{color:#879fb5}.m{color:#a9bbce;line-height:1.55}
.h,.n,.grp:not(.home-group){background:linear-gradient(145deg,#0d263e,#091b2e);border:1px solid #315473;border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 12px 28px #0003}
.h .row{flex-wrap:wrap}.h .row button{flex:1 1 75px;width:auto}
.empty{color:#9cb4c9}.toast{background:#142d44;border:1px solid #50718c;color:#fff}
/* Home: fixed hierarchy, no oversized artwork or duplicated arrows */
.home-main{padding:0 18px 30px!important;background:radial-gradient(ellipse at 100% 0%,#114269 0%,transparent 55%),#020d1b;overflow-y:auto}
.lux-hero{position:relative;min-height:310px;padding:calc(var(--top) + 22px) 12px 28px;overflow:hidden;isolation:isolate}
.lux-hero::before{content:"";position:absolute;z-index:-2;inset:0 -18px;background:linear-gradient(90deg,#03101eea 0%,#04172bc9 42%,#06142645 100%),url('lux-elevator.jpg') center 32%/cover no-repeat}
.lux-hero::after{content:"";position:absolute;z-index:-1;inset:40% -18px 0;background:linear-gradient(0deg,#020d1b,transparent)}
.lux-brand{width:min(68%,235px);height:auto;display:block;object-fit:contain;filter:drop-shadow(0 5px 15px #0008);margin-bottom:31px}
.lux-kicker{font-size:10px;letter-spacing:.29em;color:#d4dfec;font-weight:700;line-height:1.5}
.lux-accent{width:46px;height:3px;background:linear-gradient(90deg,#f5c77f,#ffda9d);box-shadow:0 0 14px #ffb757;margin:13px 0 15px;border-radius:5px}
.lux-hero h2{font-size:clamp(38px,10vw,54px);line-height:1;letter-spacing:-.06em;margin:0 0 12px;color:#fff;text-shadow:0 4px 20px #0009}
.lux-hero p{font-size:15px;line-height:1.45;max-width:275px;margin:0;color:#d2dce9}.lux-hero p em{font-style:normal;color:#f0bd73;font-weight:700}
.lux-stack{display:grid;gap:12px;padding:0 1px 25px}
.lux-card{--edge:#28baff;position:relative;display:grid;grid-template-columns:55px minmax(0,1fr) 28px;align-items:center;gap:12px;min-height:128px;padding:17px 13px;border:1px solid color-mix(in srgb,var(--edge) 72%,#fff 8%);border-radius:23px;overflow:hidden;isolation:isolate;background:#071a2b;box-shadow:inset 0 1px 0 #ffffff4a,0 10px 24px #0008,0 0 18px color-mix(in srgb,var(--edge) 18%,transparent);animation:card-rise .6s cubic-bezier(.16,1,.3,1) both;transition:transform .25s,box-shadow .25s}
.lux-card:nth-child(2){animation-delay:.07s}.lux-card:nth-child(3){animation-delay:.14s}.lux-card:nth-child(4){animation-delay:.21s}.lux-card:nth-child(5){animation-delay:.28s}
@keyframes card-rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.lux-card::before{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(90deg,#051525f7 0%,#071b2ee8 46%,#06182d5c 100%),var(--photo) center/cover no-repeat}
.lux-card::after{content:"";position:absolute;z-index:-1;inset:auto 5% 0;height:2px;background:linear-gradient(90deg,transparent,var(--edge),transparent);box-shadow:0 0 15px var(--edge)}
.lux-card:active{transform:scale(.975);box-shadow:0 0 22px var(--edge)}
.lux-card.gold{--edge:#e9ad59}.lux-card.compact{min-height:122px}
.lux-icon{width:55px;height:55px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:16px;background:linear-gradient(140deg,#0b2d4e,#061727);color:#fff;box-shadow:0 0 17px color-mix(in srgb,var(--edge) 36%,transparent),inset 0 0 12px color-mix(in srgb,var(--edge) 19%,transparent)}
.lux-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lux-copy{min-width:0}.lux-eyebrow{display:block;font-size:9px;letter-spacing:.23em;color:#e9b96e;font-weight:800;margin-bottom:6px}.lux-card b{display:block;font-size:clamp(16px,4.8vw,21px);line-height:1.13;letter-spacing:-.035em;overflow-wrap:break-word}.lux-card small{display:block;font-size:12px;line-height:1.4;color:#c4d1df;margin-top:6px}
.lux-arrow{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1px solid #a5b9ce;color:#f6cb80;font-size:23px;line-height:1;justify-self:end}
.lux-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lux-pair .lux-card{grid-template-columns:1fr 18px;grid-template-rows:auto auto;gap:7px;min-height:154px;padding:15px 12px;align-content:center}.lux-pair .lux-icon{width:43px;height:43px;grid-column:1/3}.lux-pair .lux-icon svg{width:23px;height:23px}.lux-pair .lux-card b{font-size:15px}.lux-pair .lux-card small{font-size:11px}.lux-pair .lux-arrow{grid-column:2;grid-row:2;width:18px;height:18px;font-size:17px}.lux-pair .lux-copy{grid-column:1;grid-row:2}
@media(max-width:350px){.lux-card{gap:9px;padding:12px 10px;grid-template-columns:48px minmax(0,1fr) 22px}.lux-icon{width:48px;height:48px}.lux-pair .lux-card b{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
